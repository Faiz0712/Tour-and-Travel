<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Tour Package - Wanderlust</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-brand">✈️ Wanderlust Travels</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="tours.html">Explore Tours</a></li>
      <li><a href="admin.html" class="admin-nav-btn">Admin Dashboard</a></li>
    </ul>
  </nav>

  <main class="container">
    <div class="form-card">
      <h2 style="color: var(--secondary); margin-bottom: 0.3rem;">Tour Booking Form</h2>
      <p id="tourHeaderLabel" style="color: var(--primary); font-weight: 600; margin-bottom: 1.3rem;">
        Selected Package: Loading...
      </p>

      <form id="bookingForm">
        <input type="hidden" id="tourId">
        <input type="hidden" id="unitPrice" value="0">
        <input type="hidden" id="availableSeats" value="0">

        <div class="form-group">
          <label for="customerName">Full Name *</label>
          <input type="text" id="customerName" class="form-control" placeholder="e.g. Rahul Sharma" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address *</label>
          <input type="email" id="email" class="form-control" placeholder="e.g. rahul@example.com" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number *</label>
          <input type="tel" id="phone" class="form-control" placeholder="e.g. 9876543210" required>
        </div>

        <div class="form-group">
          <label for="travelDate">Travel Date *</label>
          <input type="date" id="travelDate" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="numberOfPeople">Number of People *</label>
          <input type="number" id="numberOfPeople" class="form-control" min="1" value="1" required>
          <small id="seatsNotice" style="color: var(--text-muted); display: block; margin-top: 0.25rem;"></small>
        </div>

        <!-- Live Price Calculation: Total Amount = Tour Price × Number of People -->
        <div class="calc-box">
          <div>
            <strong>Total Amount</strong><br>
            <small style="color: var(--text-muted);">(Price × People)</small>
          </div>
          <div class="calc-total" id="displayTotal">₹0</div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
          Confirm & Book Tour
        </button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Tour & Travel Management System</p>
  </footer>

  <script src="js/booking.js"></script>
</body>
</html>
