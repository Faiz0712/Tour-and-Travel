<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Login - Wanderlust Travels</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-brand">✈️ Wanderlust Travels</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="tours.html">Explore Tours</a></li>
      <li><a href="user-login.html" class="active">Login</a></li>
      <li><a href="register.html">Register</a></li>
      <li><a href="admin-login.html" class="admin-nav-btn">Admin Dashboard</a></li>
    </ul>
  </nav>

  <main class="container" style="display: flex; align-items: center; justify-content: center; min-height: 70vh; padding: 2rem 1rem;">
    <div class="form-card" style="width: 100%; max-width: 440px; margin: 0; box-shadow: var(--shadow-lg);">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">👤</div>
        <h2 style="color: var(--secondary); margin-bottom: 0.3rem;">Traveler Sign In</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">
          Sign in to access your personal bookings and travel plans
        </p>
      </div>

      <div id="loginAlert" style="display: none; padding: 0.75rem 1rem; border-radius: 6px; font-size: 0.9rem; margin-bottom: 1.2rem; text-align: center; font-weight: 500;"></div>

      <form id="userLoginForm" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="Enter your email" required autocomplete="email" autofocus>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem; margin-top: 0.5rem;">
          Sign In
        </button>
      </form>

      <p style="text-align: center; margin-top: 1.2rem; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 600;">Create one here</a>
      </p>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Tour & Travel Management System</p>
  </footer>

  <script src="js/user-auth.js"></script>
  <script>
    // Redirect if already logged in as user
    if (UserAuth.isLoggedIn()) {
      window.location.href = 'user-dashboard.html';
    }

    const alertBox = document.getElementById('loginAlert');
    const form = document.getElementById('userLoginForm');
    const loginBtn = document.getElementById('loginBtn');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');

    // Show registered success message if redirected from registration
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('registered') === 'true') {
      alertBox.textContent = 'Account created successfully! Please sign in.';
      alertBox.style.display = 'block';
      alertBox.style.background = '#dcfce7';
      alertBox.style.color = '#15803d';
      alertBox.style.border = '1px solid #bbf7d0';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        alertBox.textContent = 'Please enter both email and password.';
        alertBox.style.display = 'block';
        alertBox.style.background = '#fee2e2';
        alertBox.style.color = '#b91c1c';
        alertBox.style.border = '1px solid #fecaca';
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          UserAuth.setSession(data.token, data.user);
          window.location.href = 'user-dashboard.html';
        } else {
          alertBox.textContent = data.message || 'Invalid email or password';
          alertBox.style.display = 'block';
          alertBox.style.background = '#fee2e2';
          alertBox.style.color = '#b91c1c';
          alertBox.style.border = '1px solid #fecaca';
          passwordInput.value = '';
          passwordInput.focus();
          loginBtn.disabled = false;
          loginBtn.textContent = 'Sign In';
        }
      } catch (err) {
        alertBox.textContent = 'Network error. Please try again.';
        alertBox.style.display = 'block';
        alertBox.style.background = '#fee2e2';
        alertBox.style.color = '#b91c1c';
        alertBox.style.border = '1px solid #fecaca';
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
